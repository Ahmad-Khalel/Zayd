<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ثانوية زيد بن حارثة للتعليم الشرعي - علم راسخ، خلق رفيع، ومستقبل واعد."
    />
    <meta name="theme-color" content="#087a3e" />
    <title>ثانوية زيد بن حارثة للتعليم الشرعي</title>
    <link rel="icon" href="assets/favicon.png" type="image/png" />
    <style>
      /* تعريف عائلة الخط الجديدة */
      @font-face {
        font-family: 'Cairo'; /* يمكنك تسميتها بأي اسم، مثلاً Qomra */
        font-style: normal;
        font-weight: 300; /* Light */
        font-display: swap;
        src: url('assets/fonts/itfQomraArabic-Light.otf') format('opentype');
      }

      @font-face {
        font-family: 'Cairo';
        font-style: normal;
        font-weight: 400; /* Regular */
        font-display: swap;
        src: url('assets/fonts/itfQomraArabic-Regular.otf') format('opentype');
      }

      @font-face {
        font-family: 'Cairo';
        font-style: normal;
        font-weight: 500; /* Medium */
        font-display: swap;
        src: url('assets/fonts/itfQomraArabic-Medium.otf') format('opentype');
      }

      @font-face {
        font-family: 'Cairo';
        font-style: normal;
        font-weight: 700; /* Bold */
        font-display: swap;
        src: url('assets/fonts/itfQomraArabic-Bold.otf') format('opentype');
      }

      @font-face {
        font-family: 'Cairo';
        font-style: normal;
        font-weight: 900; /* Black (الأثخن) */
        font-display: swap;
        src: url('assets/fonts/itfQomraArabic-Black.otf') format('opentype');
      }
      </style>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="toast-region" class="toast-region" aria-live="polite"></div>
    <script src="script.js"></script>
  </body>
</html>
